<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extra Time</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#050f24;--bg2:#0a1a38;--pn:#0f2347;--pn2:#14305e;--cy:#4da3ff;--ac:#7fd4ff;--tx:#eaf2ff;--card:#0f2347;--line:rgba(77,163,255,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 85% 0,#0d2a5c,var(--bg) 55%);background-color:var(--bg)}
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:rgba(5,15,36,.92);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:Anton,Impact,sans-serif;font-size:30px;text-transform:uppercase;line-height:.95;padding:4px 10px 2px;cursor:pointer}.brand span{color:var(--cy)}
.slg{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);padding:0 10px 14px;opacity:.8}
.nh{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6f8bb8;padding:12px 10px 6px}
.ni{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:#c4d6f2;border-left:3px solid transparent}
.ni b{margin-left:auto;font-size:11px;background:var(--pn2);border-radius:6px;padding:2px 7px;color:var(--ac)}
.ni:hover{background:var(--pn)}.ni.on{background:var(--pn2);color:#fff;border-left-color:var(--cy)}
.main{flex:1;min-width:0}
.w{max-width:820px;margin:0 auto;padding:22px 16px 60px}
h1,h2,.big{font-family:Anton,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;font-weight:400;margin:0;line-height:.95}
h1{font-size:clamp(48px,12vw,96px)}h1 span{color:var(--cy)}
h2{font-size:32px;margin-bottom:10px}
.sub{color:var(--ac);letter-spacing:.18em;font-size:12px;text-transform:uppercase;margin:6px 0 20px}
.card{background:linear-gradient(180deg,var(--pn),#0c1c3c);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:linear-gradient(160deg,var(--pn2),var(--pn));border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px);border-color:var(--cy)}
.tile .n{position:absolute;right:10px;top:-6px;font-family:Anton,sans-serif;font-size:70px;color:rgba(77,163,255,.14)}
.tile .big{font-size:30px}.tile .k{color:var(--ac);font-weight:700;font-size:13px;margin:8px 0 6px}.tile p{margin:0;font-size:12px;opacity:.7;line-height:1.4}
.g{cursor:pointer}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin:12px 0 4px}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#07142c;color:#fff;font:inherit}
.r{display:flex;gap:8px}.r>*{flex:1}
button{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:17px;padding:11px 18px;border:0;border-radius:8px;background:var(--cy);color:#04122b;cursor:pointer;margin-top:12px}
button.s{background:transparent;color:var(--ac);border:1px solid var(--cy)}button:disabled{opacity:.5}
.err{color:#ffb4b4;font-size:14px;min-height:18px;margin-top:6px}
.tag{display:inline-block;background:var(--pn2);color:var(--ac);border:1px solid var(--line);padding:2px 10px;border-radius:6px;font-weight:700;font-size:13px;margin:2px}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.win{color:var(--ac)}.t{font-size:13px;opacity:.75}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}td,th{padding:8px 6px;text-align:left;font-size:13px}
th{color:#04122b;background:linear-gradient(90deg,#4da3ff,#7fd4ff);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
table.st tr:nth-child(even) td{background:rgba(77,163,255,.07)}table.st tr.f td{color:var(--ac);font-weight:700}
td input{padding:7px;min-width:70px}
@media(max-width:860px){.shell{display:block}.side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;z-index:9;display:flex;gap:4px;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:rgba(5,15,36,.97);align-items:center}.nh,.slg,.brand{display:none}.ni{white-space:nowrap;padding:8px 12px;border-left:0;font-size:13px;flex:none}.ni b{display:none}.w{padding-bottom:96px}input,select{font-size:16px}h2{font-size:28px}}
.pitch{position:relative;height:430px;border:2px solid #fff;border-radius:10px;background:linear-gradient(#0b2bd6,#0a22b0);overflow:hidden;margin-bottom:6px}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.7)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border:2px solid rgba(255,255,255,.7);border-radius:50%}
.pawn{position:absolute;transform:translate(-50%,-50%);width:120px;text-align:center;z-index:1}
.jsy{width:54px;height:50px;margin:0 auto;background:#0a1450;color:#fff;font-family:Anton,Impact,sans-serif;font-size:24px;line-height:54px;clip-path:polygon(20% 0,35% 6%,65% 6%,80% 0,100% 22%,86% 36%,78% 30%,78% 100%,22% 100%,22% 30%,14% 36%,0 22%)}
.lab{background:#fff;color:#06204a;border-radius:4px;padding:3px 4px;font-size:11px;margin-top:3px;text-transform:uppercase;font-weight:700}
.lab b{display:block}.lab span{display:block;font-weight:400;font-size:10px;opacity:.7}
.lab input{width:100%;padding:4px;margin-top:3px;font-size:12px;background:#eef;color:#06204a;border:1px solid #99a}
.blob{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:18px auto;border-radius:58% 42% 52% 48%/50% 55% 45% 50%;overflow:hidden;box-shadow:-14px -10px 0 -2px #020e2a,12px 8px 0 -4px rgba(255,255,255,.12)}
.bi{position:absolute;inset:0;background:center/cover #1b4fb8}
.bi.nm{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;background:linear-gradient(135deg,#1b4fb8,#0a2a7a)}
.bi.nm span{font-family:Anton,Impact,sans-serif;font-size:38px;text-transform:uppercase;line-height:1}
.mask{position:absolute;left:0;right:0;background:rgba(5,20,60,.82);backdrop-filter:blur(14px)}
.cap{text-align:center;font-weight:700}.cap span{opacity:.6;font-weight:400}
.opts{position:relative;width:332px;max-width:100%;height:245px;margin:14px auto}
.ob{position:absolute;width:100px;height:100px;border-radius:50%;background:#2b2b2b;color:#fff;border:3px solid transparent;font-family:Inter,sans-serif;font-size:12px;font-weight:700;padding:6px;margin:0;text-transform:none;letter-spacing:0;line-height:1.15}
.ob.ok{background:#1f8f4a}.ob.ko{background:#b3261e}
.pitch{height:380px;background:linear-gradient(#0e4a96,#06224a);border:2px solid var(--cy)}
.tl{position:absolute;transform:translate(-50%,-50%);width:38%;background:linear-gradient(160deg,var(--pn2),var(--pn));border:1px solid var(--cy);border-radius:10px;padding:7px 4px;text-align:center;z-index:1;animation:popt .35s}
.tl.e{opacity:.5;border-style:dashed;animation:none}.tl b{display:block;font-size:13px;margin:2px 0}.tl small{display:block;font-size:10px;color:var(--ac);text-transform:uppercase;letter-spacing:.06em}
.duel{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0}
.tm{font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-size:clamp(40px,12vw,76px);line-height:1;padding:14px 22px;border:1px solid var(--cy);border-radius:12px;background:linear-gradient(160deg,var(--pn2),var(--pn));width:100%;text-align:center}
.tm.l{animation:inL .7s both}.tm.r{animation:inR .7s .9s both}.vs{font-family:Anton,sans-serif;font-size:36px;color:var(--cy);opacity:0;animation:pop .5s 1.6s forwards}
.spin{font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-size:clamp(34px,10vw,64px);text-align:center;border:1px solid var(--cy);border-radius:12px;padding:30px 12px;margin:14px 0;background:linear-gradient(160deg,var(--pn2),var(--pn))}.spin.done{color:var(--ac);animation:pop .5s}
@keyframes inL{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}@keyframes inR{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@keyframes popt{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes fi{to{opacity:1}}
.tl{--s:1}
</style></head><body><div class="shell"><nav class="side" id="nav"></nav><main class="main"><div class="w" id="app"></div></main></div>
<script>
const $=id=>document.getElementById(id);
const NAT=["France","Belgique","Brésil","Argentine","Espagne","Allemagne","Italie","Portugal","Angleterre","Pays-Bas","Croatie","Uruguay"];
const CLU=["FC Barcelone","Real Madrid","Manchester City","Manchester United","Liverpool","Bayern Munich","PSG","Juventus","AC Milan","Inter","Chelsea","Arsenal","Atlético Madrid","Dortmund","Ajax","Olympique de Marseille","Olympique Lyonnais","Monaco","Napoli","Tottenham"];
const COMP=["Ligue des champions","Coupe du monde","Euro","Premier League","Liga","Serie A","Bundesliga","Ligue 1","Copa América","Ligue Europa"];
const TH=["Meilleurs buteurs de l'histoire de la Ligue des champions","Joueurs les plus capés de l'histoire de la Coupe du monde","Meilleurs buteurs de l'histoire de la Premier League","Transferts les plus chers de l'histoire","Meilleurs buteurs de l'histoire de la Liga","Joueurs ayant remporté le plus de Ligues des champions","Meilleurs buteurs de l'histoire de la Coupe du monde","Meilleurs buteurs de l'histoire de Ligue 1","Joueurs les plus capés en sélection","Meilleurs passeurs de l'histoire de la Ligue des champions"];
const OT=["Les Ballons d'Or","Les stades mythiques","Les transferts records","Les buteurs de la Coupe du monde","Les entraîneurs légendaires","Les clubs historiques européens","Les gardiens de légende","Les finales de Ligue des champions","Les stars de la Premier League","Les stars de la Liga","Les légendes de Ligue 1","L'histoire de l'Euro","Les joueurs les plus capés en sélection"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,' ');
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const names=v=>v.split(",").map(s=>s.trim()).filter(Boolean);
let G={};
const GM=[["The Target","Atteignez la stat cible avec quatre joueurs.","Un club, une statistique, un objectif. À vous de combiner quatre joueurs pour vous en approcher au maximum.","s1"],["The Five","Composez votre cinq et faites parler les buteurs.","Deux équipes, cinq joueurs, un seul objectif : construire le meilleur cinq et marquer plus de buts que l'adversaire.","s2"],["Link-Up","Reliez les joueurs à travers leurs clubs.","Trouvez un joueur ayant joué dans le club donné, puis enchaînez avec un nouveau joueur de ce club. Jusqu'où pourrez-vous remonter la chaîne ?","s3"],["Top Bin","Trouvez les bonnes réponses et visez le sommet du classement.","Un thème, dix réponses cachées. Plus votre réponse est haut placée, plus elle vous rapporte de points.","s4"],["Standings","Remettez cinq éléments dans le bon ordre.","Dates, âges, buts, transferts… À vous de replacer les cinq réponses selon le critère demandé.","s5"],["The DS","Construisez votre mercato jusqu'au montant exact.","Une somme cible, des transferts historiques et un objectif : atteindre le montant demandé sans le dépasser.","s6"],["Career Path","Retrouvez le bon club dans la carrière d'un joueur.","Un joueur, plusieurs clubs, un seul bon choix. Saurez-vous reconnaître le club dans lequel il a réellement joué ?","s7"]];
function act(n){document.querySelectorAll(".ni").forEach((e,k)=>e.classList.toggle("on",k==n))}
function buildNav(){$("nav").innerHTML=`<div class="brand" onclick="home()">Extra<br><span>Time</span></div><div class="slg">Can you survive Extra Time?</div><div class="nh">Navigation</div><div class="ni on" onclick="home()">⌂ Accueil</div><div class="nh">Mini-jeux</div>`+GM.map((g,k)=>`<div class="ni" onclick="${g[3]}()">${g[0]}<b>${k+1}</b></div>`).join("")}
function home(){act(0);
$("app").innerHTML=`<h1>Extra<br><span>Time</span></h1><div class="sub">Can you survive Extra Time?</div><div class="tiles">${GM.map((g,k)=>`<div class="tile" onclick="${g[3]}()"><div class="n">${k+1}</div><div class="big">${g[0]}</div><div class="k">${g[1]}</div><p>${g[2]}</p></div>`).join("")}</div>`}
function back(){return `<button class="s" onclick="home()">← Menu</button>`}
/* JEU 1 */
function s1(){
$("app").innerHTML=`<h2>The Target</h2><div class="card">
<label>Joueurs (séparés par des virgules)</label><input id="p" value="Joueur 1, Joueur 2">
<label>Club / sélection / compétition</label><input id="c" placeholder="FC Barcelone">
<div class="r"><div><label>Statistique</label><select id="st"><option>buts</option><option>matchs titulaires</option><option>titres</option><option>passes décisives</option></select></div>
<div><label>Cible</label><input id="t" type="number" value="450"></div>
<div><label>Joueurs/pers.</label><input id="n" type="number" value="4" min="1" max="8"></div></div>
<button onclick="go1()">Lancer</button> <button class="s" onclick="draw1()">🎲 Nouveau tirage</button> ${back()}<div class="err" id="e"></div></div>`;draw1()}
async function draw1(){
const ty=rnd(["c","n","k"]),c=ty=="c"?rnd(CLU):ty=="n"?rnd(NAT):rnd(COMP),st=ty=="k"?rnd(["buts","matchs titulaires","passes décisives"]):rnd(["buts","matchs titulaires","titres","passes décisives"]);
$("c").value=c;$("st").value=st;const D={"buts":400,"matchs titulaires":1200,"titres":30,"passes décisives":250};$("t").value=D[st];
if(SM)try{const r=await SM.json(`Quizz foot : 4 joueurs additionnent leur nombre de ${st} avec/en « ${c} » pour s'approcher d'une cible. Propose une cible réaliste et stimulante (total de 4 très bons joueurs de ce contexte). JSON uniquement : {"cible":nombre entier}`,{modelTier:"default"});if(r.cible>0&&$("t"))$("t").value=Math.round(r.cible)}catch(e){}}
function go1(){
const p=names($("p").value),t=+$("t").value,n=+$("n").value;
if(p.length<2||new Set(p.map(norm)).size<p.length)return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";
if(!$("c").value.trim()||!t)return $("e").textContent="Fais un tirage ou renseigne le club et la cible.";
G={p,t,n,c:$("c").value.trim(),st:$("st").value,picks:p.map(()=>[]),used:[],turn:0};r1()}
function r1(){
const{p,t,n,c,st,picks}=G,total=p.length*n;
if(G.turn>=total)return res1();
const i=G.turn%p.length;
$("app").innerHTML=`<h2>${esc(c)}</h2><div class="sub">Cible : ${t} ${st}</div>
<div class="card"><div class="t">Tour ${G.turn+1}/${total}</div><h2 class="win">${esc(p[i])}</h2>
${G.pend?pend1():`<label>Joueur cité</label><input id="pl" placeholder="ex : Cristiano Ronaldo"><button id="b1" onclick="add1(${i})">Valider</button><div class="t">${SM?"Le nombre de "+st+" avec "+esc(c)+" est calculé automatiquement.":"Mode manuel : saisis la stat toi-même."}</div>${SM?"":'<label>Nombre de '+st+'</label><input id="v" type="number" min="0">'}`}<div class="err" id="e"></div></div>
<div class="card">${p.map((x,k)=>`<div class="row"><b>${esc(x)}</b><span>${picks[k].map(q=>`<span class="tag">${esc(q.n)} ${q.v}</span>`).join("")} <b>= ${picks[k].reduce((a,q)=>a+q.v,0)}</b></span></div>`).join("")}</div>
<div class="t">Déjà cités : ${G.used.length}</div>${back()}`}
let SM=null;
SM={json:async(q,o)=>{const r=await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ctx:o&&o.ctx,prompt:"Source de référence obligatoire : Transfermarkt (transfermarkt.com) pour les montants de transfert, matchs, buts, passes décisives, carrières et palmarès. En cas de doute, privilégie les données de Transfermarkt.\n"+q})});if(!r.ok)throw new Error("verify "+r.status);return r.json()}};
function pend1(){const q=G.pend;return `<div class="big win" style="font-size:30px">${esc(q.n)}</div><div class="t">${esc(q.note||"")}</div><label>${G.st} avec ${esc(G.c)} (modifiable)</label><input id="pv" type="number" min="0" value="${q.v??""}"><div class="r"><button onclick="ok1()">Confirmer</button><button class="s" onclick="G.pend=null;r1()">Annuler</button></div>`}
async function add1(i){
const nm=$("pl")?$("pl").value.trim():"";
if(!nm)return $("e").textContent="Saisis un joueur.";
if(G.used.includes(norm(nm)))return $("e").textContent="❌ Déjà cité ! Choisis un autre joueur.";
if(!SM){const v=$("v").value;if(v===""||+v<0)return $("e").textContent="Nombre requis.";G.pend={i,n:nm,v:+v};return ok1(true)}
$("e").textContent="🔎 Recherche en cours…";$("b1").disabled=true;
try{
const r=await SM.json(`Tu es l'arbitre d'un quizz de foot. Joueur cité : "${nm}". Contexte : ${G.c}. Statistique demandée : ${G.st}, comptées uniquement sous le maillot / dans le cadre de "${G.c}" (toutes compétitions officielles confondues, sauf si c'est une compétition précise). Réponds UNIQUEMENT en JSON : {"player":"nom complet correct","value":nombre entier ou null si le joueur n'a jamais joué pour/dans ce contexte ou est inconnu,"note":"une courte phrase de précision (période, doute éventuel)"}`,{modelTier:"default",ctx:{p:[nm],c:[G.c]}});
if(G.used.includes(norm(r.player||nm))){$("e").textContent="❌ "+(r.player||nm)+" a déjà été cité !";$("b1").disabled=false;return}
G.pend={i,n:r.player||nm,v:r.value,note:(r.value==null?"Aucune stat trouvée : saisis-la ou annule. ":"")+(r.note||"")+" · estimation IA, corrige si besoin"};
}catch(e){G.pend={i,n:nm,v:null,note:"Recherche indisponible : saisis la stat manuellement."}}
r1()}
function ok1(skip){
const q=G.pend,v=skip?q.v:$("pv").value;
if(v===""||v==null||+v<0)return $("e").textContent="Indique un nombre.";
if(G.used.includes(norm(q.n)))return $("e").textContent="❌ Déjà cité !";
G.used.push(norm(q.n));G.picks[q.i].push({n:q.n,v:+v});G.pend=null;G.turn++;r1()}
function res1(){
const{p,t,picks,st,c}=G;
const R=p.map((x,k)=>{const s=picks[k].reduce((a,q)=>a+q.v,0);return{x,s,d:Math.abs(t-s),k}}).sort((a,b)=>a.d-b.d);
$("app").innerHTML=`<h1>Résul<span>tats</span></h1><div class="sub">${t} ${st} · ${esc(c)}</div>
${R.map((r,j)=>`<div class="card"><div class="row ${j?'':'win'}"><b>${j+1}. ${esc(r.x)}${j?'':' 🏆'}</b><span>${r.s} (écart ${r.d})</span></div><div>${picks[r.k].map(q=>`<span class="tag">${esc(q.n)} ${q.v}</span>`).join("")}</div></div>`).join("")}
<button onclick="go1Again()">Rejouer</button> ${back()}`}
function go1Again(){s1()}
/* JEU 2 */
const SL=["Défenseur","Milieu","Milieu","Attaquant","Attaquant"],SP=[[50,82],[28,55],[72,55],[28,24],[72,24]];
function s2(){$("app").innerHTML=`<h2>The Five</h2><div class="card"><div class="t">Deux équipes tirées au sort. À chaque tour, cite un joueur lié à l'une des deux, au poste de ton choix (1 défenseur, 2 milieux, 2 attaquants, dans l'ordre que tu veux). Le five qui marque le plus de buts gagne.</div><label>Joueurs (séparés par des virgules)</label><input id="p" value="Joueur 1, Joueur 2"><label>Type de tirage</label><select id="ty"><option value="n">Sélections nationales (+ club tiré à chaque tour)</option><option value="c">Clubs</option></select><button onclick="go2()">Tirer au sort</button> ${back()}<div class="err" id="e"></div></div>`}
function go2(){const p=names($("p").value);if(!okP(p))return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";const ty=$("ty").value,L=ty=="n"?NAT:CLU,a=rnd(L);let b;do{b=rnd(L)}while(b==a);G={p,a,b,ty,rd:0,k:0,club:null,cl:[],used:[],L:p.map(()=>SL.map(()=>null))};intro2()}
function intro2(){$("app").innerHTML=`<div class="sub">Le duel</div><div class="duel"><div class="tm l">${esc(G.a)}</div><div class="vs">VS</div><div class="tm r">${esc(G.b)}</div></div><div style="text-align:center;opacity:0;animation:fi .5s 2.3s forwards"><button onclick="rd2()">${G.ty=="n"?"Tirer le premier club":"Commencer"}</button></div>${back()}`}
function rd2(){if(G.rd>=5)return res2();G.k=0;G.ty=="n"?spin2():r2()}

const i=G.turn%p.length,q=G.pend;
$("app").innerHTML=`<h2>The DS</h2><div class="sub">Cible : ${t} M€</div><div class="card"><div class="t">Tour ${G.turn+1}/${tot}</div><h2 class="win" style="font-size:28px">${esc(p[i])}</h2>
${q?`<div class="big win" style="font-size:30px">${esc(q.n)}</div><div class="t">${esc(q.tr)} ${esc(q.note||"")}</div>${q.unv?`<div class="t"><a style="color:var(--cy)" target="_blank" rel="noopener" href="https://www.transfermarkt.fr/schnellsuche/ergebnis/schnellsuche?query=${encodeURIComponent(q.n)}">🔗 Chercher ${esc(q.n)} sur Transfermarkt</a></div>`:""}<label>Montant en M€ (modifiable)</label><input id="pv" type="number" min="0" value="${q.v??""}"><div class="r"><button onclick="ok6()">${q.unv?"Confirmer quand même":"Confirmer"}</button><button class="s" onclick="G.pend=null;G.msg='';r6()">Annuler</button></div>`:`<label>Joueur</label><input id="pl" placeholder="Neymar"><label>Transfert</label><input id="tr" placeholder="Barcelone vers PSG"><button id="b" onclick="add6(${i})">Valider</button>`}
<div class="err" id="e">${esc(G.msg)}</div></div>
${board(p,k=>picks[k].map(x=>`<span class="tag">${esc(x.n)} ${x.v} M€</span>`).join("")+" = "+picks[k].reduce((a,x)=>a+x.v,0)+" M€")}${back()}`}
async function add6(i){
const nm=$("pl").value.trim(),tr=$("tr").value.trim();
if(!nm||!tr)return $("e").textContent="Remplis le joueur et le transfert.";
if(G.used.includes(norm(nm)))return $("e").textContent="❌ Déjà cité !";
if(!need())return;$("b").disabled=true;$("e").textContent="🔎 Vérification du transfert…";
try{const r=await SM.json(`Quizz foot « Le DS ». Date du jour : ${new Date().toLocaleDateString("fr-FR")}. Tes connaissances peuvent être en retard sur le mercato récent : si tu ne connais pas ce transfert, mets valid=false (ne dis jamais qu'il n'a pas eu lieu) et explique dans note. Joueur : "${nm}". Transfert annoncé : "${tr}". Vérifie que ce joueur a bien été transféré entre ces deux clubs, puis donne le montant officiel de l'indemnité de transfert en millions d'euros (nombre ; prêt ou libre = 0). S'il y a eu plusieurs transferts entre ces clubs, prends le plus connu. JSON uniquement : {"valid":true,"player":"nom complet","from":"club de départ","to":"club d'arrivée","year":"année","fee":nombre ou null,"note":"courte précision"}`,{modelTier:"default",ctx:{p:[nm]}});
if(r.valid!==true){G.pend={i,n:r.player||nm,tr,v:r.fee??null,unv:1,note:"· ⚠ Transfert non reconnu"+(r.note?" ("+r.note+")":"")+". Il est peut-être trop récent : vérifie sur Transfermarkt, puis confirme avec le bon montant."};G.msg="";return r6()}
if(G.used.includes(norm(r.player||nm))){G.msg="❌ "+(r.player||nm)+" déjà cité !";return r6()}
G.pend={i,n:r.player||nm,tr:`${r.from} → ${r.to}${r.year?" ("+r.year+")":""}`,v:r.fee,note:"· "+(r.note||"")+" · estimation IA, corrige si besoin"};G.msg="";r6()
}catch(e){G.pend={i,n:nm,tr,v:null,unv:1,note:"· vérification indisponible : saisis le montant (Transfermarkt)"};G.msg="";r6()}}
function ok6(){const q=G.pend,v=$("pv").value;
if(v===""||+v<0)return $("e").textContent="Indique un montant.";
if(G.used.includes(norm(q.n)))return $("e").textContent="❌ Déjà cité !";
G.used.push(norm(q.n));G.picks[q.i].push({n:q.n,tr:q.tr,v:+v});G.pend=null;G.msg="";G.turn++;r6()}
function res6(){
const{p,t,picks}=G,R=p.map((x,k)=>{const s=picks[k].reduce((a,q)=>a+q.v,0);return{x,s,d:Math.abs(t-s),k}}).sort((a,b)=>a.d-b.d);
$("app").innerHTML=`<h1>Résul<span>tats</span></h1><div class="sub">Cible : ${t} M€</div>
${R.map((r,j)=>`<div class="card"><div class="row ${j?'':'win'}"><b>${j+1}. ${esc(r.x)}${j?'':' 🏆'}</b><span>${r.s} M€ (écart ${r.d})</span></div>${picks[r.k].map(q=>`<div class="t">${esc(q.n)} · ${esc(q.tr)} · ${q.v} M€</div>`).join("")}</div>`).join("")}
<button onclick="s6()">Rejouer</button> ${back()}`}

/* JEU 7 : LE PARCOURS */
function s7(){$("app").innerHTML=setup("Career Path","Un joueur, 5 clubs : un seul est bon. Trouve le club où il a joué. Les autres n'y ont jamais joué.",'<label>Mode</label><select id="md"><option value="n">Joueur tiré au sort (nom affiché)</option><option value="p">Photo perso (maillot masqué)</option></select><label>Questions par joueur</label><input id="n" type="number" value="3" min="1">',"go7")}
function go7(){const p=names($("p").value);if(!okP(p))return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";if(!need())return;G={p,md:$("md").value,n:+$("n").value||3,sc:p.map(()=>0),turn:0,seen:[],q:null};nx7()}
function nx7(){if(G.turn>=G.p.length*G.n)return res7();G.md=="p"?ph7():gen7(null)}
function retry7(){gen7(G.md=="p"?G.nmP:null)}
function ph7(){G.img=null;
$("app").innerHTML=`<h2>Photo perso</h2><div class="card"><div class="t">Maître du jeu : choisis une photo du joueur (cachée aux autres), écris son nom, puis règle le cache pour masquer le maillot.</div><label>Photo</label><input id="im" type="file" accept="image/*" onchange="im7()"><label>Nom du joueur</label><input id="nm">
<div class="blob"><div class="bi" id="pv"></div><div class="mask" id="mk"></div></div>
<label>Cache : position</label><input id="mt" type="range" min="0" max="90" value="55" oninput="mk7()"><label>Cache : hauteur</label><input id="mh" type="range" min="10" max="100" value="45" oninput="mk7()">
<button onclick="ok7()">Lancer la question</button><div class="err" id="e"></div></div>${back()}`;mk7()}
function im7(){const f=$("im").files[0];if(!f)return;const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);G.img=c.toDataURL("image/jpeg",.85);$("pv").style.backgroundImage=`url(${G.img})`};i.src=URL.createObjectURL(f)}
function mk7(){const m=$("mk");m.style.top=$("mt").value+"%";m.style.height=$("mh").value+"%"}
function ok7(){const n=$("nm").value.trim();if(!G.img||!n)return $("e").textContent="Ajoute une photo et le nom du joueur.";G.mask={t:+$("mt").value,h:+$("mh").value};G.nmP=n;gen7(n)}
async function gen7(name){
$("app").innerHTML=`<div class="sub">🔎 Préparation de la question…</div>`;
for(let t=0;t<2;t++)try{
const r=await SM.json(`Quizz foot « Le Parcours ». Date du jour : ${new Date().toLocaleDateString("fr-FR")}. ${name?`Le joueur est "${name}".`:`Choisis au hasard un footballeur professionnel connu (varie époques, pays et postes ; évite : ${G.seen.join(", ")||"aucun"}).`} Donne : "bon" = un club où il a réellement joué en équipe première ; "faux" = 4 clubs plausibles (niveau et pays comparables) où il n'a JAMAIS joué, même en prêt ; "carriere" = tous ses clubs. JSON uniquement : {"joueur":"nom complet","bon":"club","faux":["a","b","c","d"],"carriere":["..."]}`,{modelTier:"default",ctx:{p:name?[name]:[]}});
const car=(r.carriere||[]).map(norm),faux=[...new Set(r.faux||[])].filter(x=>!car.includes(norm(x))&&norm(x)!=norm(r.bon));
if(!r.bon||faux.length<2)continue;
G.seen.push(r.joueur);G.q={j:r.joueur,bon:r.bon,car:r.carriere||[r.bon],opts:sh([r.bon,...faux.slice(0,4)]),pick:null};return q7()}catch(e){}
$("app").innerHTML=`<div class="card"><div class="err">Impossible de préparer la question.</div><button onclick="retry7()">Réessayer</button> ${back()}</div>`}
function q7(){const{p,q,md}=G,i=G.turn%p.length,pos=[[0,46],[116,4],[232,46],[58,136],[174,136]];
$("app").innerHTML=`<div class="sub">Tour ${G.turn+1}/${p.length*G.n} · ${esc(p[i])}</div>
<div class="blob">${md=="p"?`<div class="bi" style="background-image:url(${G.img})"></div>${q.pick===null?`<div class="mask" style="top:${G.mask.t}%;height:${G.mask.h}%"></div>`:""}`:`<div class="bi nm"><span>${esc(q.j)}</span></div>`}</div>
<div class="cap">${md=="p"?"Qui est-ce ?":"Career Path"} · <span>où a-t-il joué ?</span></div>
<div class="opts">${q.opts.map((o,k)=>`<button class="ob ${q.pick===null?"":o==q.bon?"ok":q.pick==o?"ko":""}" style="left:${pos[k][0]}px;top:${pos[k][1]}px" ${q.pick===null?`onclick="ans7(${k})"`:"disabled"}>${esc(o)}</button>`).join("")}</div>
${q.pick!==null?`<div class="card"><b class="win">${q.pick==q.bon?"✅ Bonne réponse !":"❌ Raté, c'était "+esc(q.bon)}</b><div class="t" style="margin-top:6px">${esc(q.j)} : ${q.car.map(esc).join(" → ")}</div>${q.pick!=q.bon&&!q.ov?`<button class="s" onclick="G.sc[G.turn%G.p.length]++;G.q.ov=1;q7()">Valider quand même (le groupe tranche)</button> `:""}<button onclick="G.turn++;nx7()">Suivant</button></div>`:""}${back()}`}
function ans7(k){const q=G.q;q.pick=q.opts[k];if(q.pick==q.bon)G.sc[G.turn%G.p.length]++;q7()}
function res7(){const R=G.p.map((x,k)=>({x,s:G.sc[k]})).sort((a,b)=>b.s-a.s);
$("app").innerHTML=`<h1>Résul<span>tats</span></h1>${R.map((r,j)=>`<div class="card"><div class="row ${j?'':'win'}"><b>${j+1}. ${esc(r.x)}${j?'':' 🏆'}</b><span>${r.s}/${G.n}</span></div></div>`).join("")}<button onclick="s7()">Rejouer</button> ${back()}`}
buildNav();
[1,2,3,4,5,6,7].forEach(n=>{const o=window["s"+n];window["s"+n]=function(){act(n);return o.apply(this,arguments)}});
home();
