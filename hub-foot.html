<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub Quizz Foot</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06204a;--bg2:#0b4a8f;--cy:#6cd0ff;--tx:#fff;--card:rgba(255,255,255,.08);--line:rgba(108,208,255,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Inter,system-ui,sans-serif;background:repeating-radial-gradient(circle at 0 0,transparent 0 26px,var(--line) 26px 28px) top left/520px 520px no-repeat,radial-gradient(circle at 80% 100%,var(--bg2),var(--bg) 60%);background-color:var(--bg)}
.w{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1,h2,.big{font-family:Anton,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;font-weight:400;margin:0;line-height:.95}
h1{font-size:clamp(56px,16vw,120px)}h1 span{color:var(--cy)}
h2{font-size:34px;margin-bottom:10px}
.sub{color:var(--cy);letter-spacing:.2em;font-size:12px;text-transform:uppercase;margin:6px 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.g{cursor:pointer;transition:.15s}.g:hover{transform:translateY(-2px);border-color:var(--cy)}
.g .big{font-size:44px}.g p{margin:6px 0 0;opacity:.8;font-size:14px}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cy);margin:12px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:inherit}
.r{display:flex;gap:8px}.r>*{flex:1}
button{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:18px;padding:11px 18px;border:0;border-radius:10px;background:var(--cy);color:#06204a;cursor:pointer;margin-top:12px}
button.s{background:transparent;color:var(--cy);border:1px solid var(--cy)}
.err{color:#ff9b9b;font-size:14px;min-height:18px;margin-top:6px}
.tag{display:inline-block;background:var(--cy);color:#06204a;padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px;margin:2px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.win{color:var(--cy)}.t{font-size:13px;opacity:.75}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}td,th{padding:6px 4px;text-align:left;font-size:13px}th{color:var(--cy)}
td input{padding:7px;min-width:70px}
.pitch{position:relative;height:430px;border:2px solid #fff;border-radius:10px;background:linear-gradient(#0b2bd6,#0a22b0);overflow:hidden;margin-bottom:6px}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.7)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border:2px solid rgba(255,255,255,.7);border-radius:50%}
.pawn{position:absolute;transform:translate(-50%,-50%);width:120px;text-align:center;z-index:1}
.jsy{width:54px;height:50px;margin:0 auto;background:#0a1450;color:#fff;font-family:Anton,Impact,sans-serif;font-size:24px;line-height:54px;clip-path:polygon(20% 0,35% 6%,65% 6%,80% 0,100% 22%,86% 36%,78% 30%,78% 100%,22% 100%,22% 30%,14% 36%,0 22%)}
.lab{background:#fff;color:#06204a;border-radius:4px;padding:3px 4px;font-size:11px;margin-top:3px;text-transform:uppercase;font-weight:700}
.lab b{display:block}.lab span{display:block;font-weight:400;font-size:10px;opacity:.7}
.lab input{width:100%;padding:4px;margin-top:3px;font-size:12px;background:#eef;color:#06204a;border:1px solid #99a}
.blob{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:18px auto;border-radius:58% 42% 52% 48%/50% 55% 45% 50%;overflow:hidden;box-shadow:-14px -10px 0 -2px #020e2a,12px 8px 0 -4px rgba(255,255,255,.12)}
.bi{position:absolute;inset:0;background:center/cover #1b4fb8}
.bi.nm{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;background:linear-gradient(135deg,#1b4fb8,#0a2a7a)}
.bi.nm span{font-family:Anton,Impact,sans-serif;font-size:38px;text-transform:uppercase;line-height:1}
.mask{position:absolute;left:0;right:0;background:rgba(5,20,60,.82);backdrop-filter:blur(14px)}
.cap{text-align:center;font-weight:700}.cap span{opacity:.6;font-weight:400}
.opts{position:relative;width:332px;max-width:100%;height:245px;margin:14px auto}
.ob{position:absolute;width:100px;height:100px;border-radius:50%;background:#2b2b2b;color:#fff;border:3px solid transparent;font-family:Inter,sans-serif;font-size:12px;font-weight:700;padding:6px;margin:0;text-transform:none;letter-spacing:0;line-height:1.15}
.ob.ok{background:#1f8f4a}.ob.ko{background:#b3261e}
</style></head><body><div class="w" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const NAT=["France","Belgique","Brésil","Argentine","Espagne","Allemagne","Italie","Portugal","Angleterre","Pays-Bas","Croatie","Uruguay"];
const CLU=["FC Barcelone","Real Madrid","Manchester City","Manchester United","Liverpool","Bayern Munich","PSG","Juventus","AC Milan","Inter","Chelsea","Arsenal","Atlético Madrid","Dortmund","Ajax","Olympique de Marseille","Olympique Lyonnais","Monaco","Napoli","Tottenham"];
const COMP=["Ligue des champions","Coupe du monde","Euro","Premier League","Liga","Serie A","Bundesliga","Ligue 1","Copa América","Ligue Europa"];
const TH=["Meilleurs buteurs de l'histoire de la Ligue des champions","Joueurs les plus capés de l'histoire de la Coupe du monde","Meilleurs buteurs de l'histoire de la Premier League","Transferts les plus chers de l'histoire","Meilleurs buteurs de l'histoire de la Liga","Joueurs ayant remporté le plus de Ligues des champions","Meilleurs buteurs de l'histoire de la Coupe du monde","Meilleurs buteurs de l'histoire de Ligue 1","Joueurs les plus capés en sélection","Meilleurs passeurs de l'histoire de la Ligue des champions"];
const OT=["Les Ballons d'Or","Les stades mythiques","Les transferts records","Les buteurs de la Coupe du monde","Les entraîneurs légendaires","Les clubs historiques européens","Les gardiens de légende","Les finales de Ligue des champions","Les stars de la Premier League","Les stars de la Liga","Les légendes de Ligue 1","L'histoire de l'Euro","Les joueurs les plus capés en sélection"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,' ');
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const names=v=>v.split(",").map(s=>s.trim()).filter(Boolean);
let G={};
function home(){
$("app").innerHTML=`<h1>Quizz<br><span>Foot</span></h1><div class="sub">Hub de mini-jeux · Entre potes</div>
<div class="card g" onclick="s1()"><div class="big">1 · Le Compte est bon</div><p>Un club, une stat cible. 4 joueurs chacun pour s'approcher au plus près du total.</p></div>
<div class="card g" onclick="s2()"><div class="big">2 · Compose ton Five</div><p>2 équipes tirées au sort, 1 déf, 2 milieux, 2 attaquants. Le plus de buts gagne.</p></div>
<div class="card g" onclick="s3()"><div class="big">3 · Le Chaînon</div><p>Enchaîne des joueurs qui ont partagé un club. Le club est vérifié, 3 vies par joueur.</p></div>
<div class="card g" onclick="s4()"><div class="big">4 · Le Top 10</div><p>Un thème, un top 10 caché. Plus ton joueur est haut, plus tu marques.</p></div>
<div class="card g" onclick="s5()"><div class="big">5 · L'Ordre</div><p>Classe 5 éléments dans le bon ordre selon un critère. Manches cumulées.</p></div>
<div class="card g" onclick="s6()"><div class="big">6 · Le DS</div><p>Directeur sportif : annonce des transferts pour atteindre la somme cible en millions.</p></div>
<div class="card g" onclick="s7()"><div class="big">7 · Le Parcours</div><p>Un joueur, 5 clubs : trouve celui où il a vraiment joué. Nom tiré au sort ou photo perso.</p></div>`}
function back(){return `<button class="s" onclick="home()">← Hub</button>`}
/* JEU 1 */
function s1(){
$("app").innerHTML=`<h2>Le Compte est bon</h2><div class="card">
<label>Joueurs (séparés par des virgules)</label><input id="p" value="Joueur 1, Joueur 2">
<label>Club / sélection / compétition</label><input id="c" placeholder="FC Barcelone">
<div class="r"><div><label>Statistique</label><select id="st"><option>buts</option><option>matchs titulaires</option><option>titres</option><option>passes décisives</option></select></div>
<div><label>Cible</label><input id="t" type="number" value="450"></div>
<div><label>Joueurs/pers.</label><input id="n" type="number" value="4" min="1" max="8"></div></div>
<button onclick="go1()">Lancer</button> <button class="s" onclick="draw1()">🎲 Nouveau tirage</button> ${back()}<div class="err" id="e"></div></div>`;draw1()}
async function draw1(){
const ty=rnd(["c","n","k"]),c=ty=="c"?rnd(CLU):ty=="n"?rnd(NAT):rnd(COMP),st=ty=="k"?rnd(["buts","matchs titulaires","passes décisives"]):rnd(["buts","matchs titulaires","titres","passes décisives"]);
$("c").value=c;$("st").value=st;const D={"buts":400,"matchs titulaires":1200,"titres":30,"passes décisives":250};$("t").value=D[st];
if(SM)try{const r=await SM.json(`Quizz foot : 4 joueurs additionnent leur nombre de ${st} avec/en « ${c} » pour s'approcher d'une cible. Propose une cible réaliste et stimulante (total de 4 très bons joueurs de ce contexte). JSON uniquement : {"cible":nombre entier}`,{modelTier:"default"});if(r.cible>0&&$("t"))$("t").value=Math.round(r.cible)}catch(e){}}
function go1(){
const p=names($("p").value),t=+$("t").value,n=+$("n").value;
if(p.length<2||new Set(p.map(norm)).size<p.length)return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";
if(!$("c").value.trim()||!t)return $("e").textContent="Fais un tirage ou renseigne le club et la cible.";
G={p,t,n,c:$("c").value.trim(),st:$("st").value,picks:p.map(()=>[]),used:[],turn:0};r1()}
function r1(){
const{p,t,n,c,st,picks}=G,total=p.length*n;
if(G.turn>=total)return res1();
const i=G.turn%p.length;
$("app").innerHTML=`<h2>${esc(c)}</h2><div class="sub">Cible : ${t} ${st}</div>
<div class="card"><div class="t">Tour ${G.turn+1}/${total}</div><h2 class="win">${esc(p[i])}</h2>
${G.pend?pend1():`<label>Joueur cité</label><input id="pl" placeholder="ex : Cristiano Ronaldo"><button id="b1" onclick="add1(${i})">Valider</button><div class="t">${SM?"Le nombre de "+st+" avec "+esc(c)+" est calculé automatiquement.":"Mode manuel : saisis la stat toi-même."}</div>${SM?"":'<label>Nombre de '+st+'</label><input id="v" type="number" min="0">'}`}<div class="err" id="e"></div></div>
<div class="card">${p.map((x,k)=>`<div class="row"><b>${esc(x)}</b><span>${picks[k].map(q=>`<span class="tag">${esc(q.n)} ${q.v}</span>`).join("")} <b>= ${picks[k].reduce((a,q)=>a+q.v,0)}</b></span></div>`).join("")}</div>
<div class="t">Déjà cités : ${G.used.length}</div>${back()}`}
let SM=null;
try{window.claude&&claude.use("sample").then(x=>{SM={json:(q,o)=>x.json("Source de référence obligatoire : Transfermarkt (transfermarkt.com) pour les montants de transfert, matchs, buts, passes décisives, carrières et palmarès. En cas de doute, privilégie les données de Transfermarkt.\n"+q,o)}}).catch(()=>{})}catch(e){}
function pend1(){const q=G.pend;return `<div class="big win" style="font-size:30px">${esc(q.n)}</div><div class="t">${esc(q.note||"")}</div><label>${G.st} avec ${esc(G.c)} (modifiable)</label><input id="pv" type="number" min="0" value="${q.v??""}"><div class="r"><button onclick="ok1()">Confirmer</button><button class="s" onclick="G.pend=null;r1()">Annuler</button></div>`}
async function add1(i){
const nm=$("pl")?$("pl").value.trim():"";
if(!nm)return $("e").textContent="Saisis un joueur.";
if(G.used.includes(norm(nm)))return $("e").textContent="❌ Déjà cité ! Choisis un autre joueur.";
if(!SM){const v=$("v").value;if(v===""||+v<0)return $("e").textContent="Nombre requis.";G.pend={i,n:nm,v:+v};return ok1(true)}
$("e").textContent="🔎 Recherche en cours…";$("b1").disabled=true;
try{
const r=await SM.json(`Tu es l'arbitre d'un quizz de foot. Joueur cité : "${nm}". Contexte : ${G.c}. Statistique demandée : ${G.st}, comptées uniquement sous le maillot / dans le cadre de "${G.c}" (toutes compétitions officielles confondues, sauf si c'est une compétition précise). Réponds UNIQUEMENT en JSON : {"player":"nom complet correct","value":nombre entier ou null si le joueur n'a jamais joué pour/dans ce contexte ou est inconnu,"note":"une courte phrase de précision (période, doute éventuel)"}`,{modelTier:"default"});
if(G.used.includes(norm(r.player||nm))){$("e").textContent="❌ "+(r.player||nm)+" a déjà été cité !";$("b1").disabled=false;return}
G.pend={i,n:r.player||nm,v:r.value,note:(r.value==null?"Aucune stat trouvée : saisis-la ou annule. ":"")+(r.note||"")+" · estimation IA, corrige si besoin"};
}catch(e){G.pend={i,n:nm,v:null,note:"Recherche indisponible : saisis la stat manuellement."}}
r1()}
function ok1(skip){
const q=G.pend,v=skip?q.v:$("pv").value;
if(v===""||v==null||+v<0)return $("e").textContent="Indique un nombre.";
if(G.used.includes(norm(q.n)))return $("e").textContent="❌ Déjà cité !";
G.used.push(norm(q.n));G.picks[q.i].push({n:q.n,v:+v});G.pend=null;G.turn++;r1()}
function res1(){
const{p,t,picks,st,c}=G;
const R=p.map((x,k)=>{const s=picks[k].reduce((a,q)=>a+q.v,0);return{x,s,d:Math.abs(t-s),k}}).sort((a,b)=>a.d-b.d);
$("app").innerHTML=`<h1>Résul<span>tats</span></h1><div class="sub">${t} ${st} · ${esc(c)}</div>
${R.map((r,j)=>`<div class="card"><div class="row ${j?'':'win'}"><b>${j+1}. ${esc(r.x)}${j?'':' 🏆'}</b><span>${r.s} (écart ${r.d})</span></div><div>${picks[r.k].map(q=>`<span class="tag">${esc(q.n)} ${q.v}</span>`).join("")}</div></div>`).join("")}
<button onclick="go1Again()">Rejouer</button> ${back()}`}
function go1Again(){s1()}
/* JEU 2 */
function s2(){
$("app").innerHTML=`<h2>Compose ton Five</h2><div class="card">
<label>Joueurs (séparés par des virgules)</label><input id="p" value="Joueur 1, Joueur 2">
<label>Type de tirage</label><select id="ty"><option value="n">Sélections nationales</option><option value="c">Clubs</option></select>
<button onclick="go2()">Tirer au sort</button> ${back()}<div class="err" id="e"></div></div>`}
const PH=[{t:"Défenseur",s:[0]},{t:"Milieux",s:[1,2]},{t:"Attaquants",s:[3,4]}];
const SLOT=[{s:"Défenseur",n:4,x:50,y:80},{s:"Milieu",n:8,x:27,y:52},{s:"Milieu",n:10,x:73,y:52},{s:"Attaquant",n:9,x:27,y:22},{s:"Attaquant",n:11,x:73,y:22}];
async function go2(){
const p=names($("p").value);
if(!okP(p))return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";
const ty=$("ty").value,L=ty=="n"?NAT:CLU;let a=rnd(L),b;do{b=rnd(L)}while(b==a);
G={p,a,b,ty,ph:0,slots:SLOT.map(x=>({...x,c:null})),nm:{}};$("app").innerHTML=`<div class="sub">🎲 Tirage du club…</div>`;await draw2();r2()}
async function draw2(){
const ph=PH[G.ph],nd=ph.s.length,pos=G.slots[ph.s[0]].s,used=G.slots.map(x=>x.c).filter(Boolean),{a,b}=G;
const cond=G.ty=="n"?`Le joueur doit avoir la nationalité (ou avoir joué en sélection) de ${a} ou ${b}.`:`Le joueur doit avoir joué pour ${a} ou ${b}.`;
let ok=[];
if(SM)for(let t=0;t<3&&ok.length<nd;t++){
try{const c=sh(CLU.filter(x=>!used.includes(x)&&!ok.some(o=>o.club==x))).slice(0,8);
const r=await SM.json(`Quizz foot. Duel : ${a} vs ${b}. ${cond} Poste recherché : ${pos} (poste principal). Pour chacun de ces clubs : ${JSON.stringify(c)}, indique s'il existe au moins un joueur à ce poste qui respecte la condition du duel ET a joué pour l'équipe première du club. Donne jusqu'à 2 exemples réels. JSON uniquement : [{"club":"nom exact de la liste","possible":true,"exemples":["nom"]}]`,{modelTier:"default"});
(Array.isArray(r)?r:r.clubs||[]).forEach(x=>{const m=c.find(y=>norm(y)==norm(x.club||""));if(x.possible&&m&&!ok.some(o=>o.club==m))ok.push({club:m,exemples:x.exemples||[]})})}catch(e){}}
ok=sh(ok);const chosen=[];
ph.s.forEach((i,j)=>{const x=ok[j],c=x?x.club:rnd(CLU.filter(k=>!used.includes(k)&&!chosen.includes(k)));chosen.push(c);G.slots[i].c=c;G.slots[i].ex=x?x.exemples:null})}
function pitch2(k){const cur=PH[G.ph].s;
return `<div class="pitch">${G.slots.map((x,i)=>{
const st=x.c===null?0:cur.includes(i)?1:2,v=G.nm[k+"_"+i]||"";
return `<div class="pawn" style="left:${x.x}%;top:${x.y}%"><div class="jsy">${x.n}</div><div class="lab">${st==0?"?":st==1?`<b>${esc(x.c)}</b><input id="n${k}_${i}" placeholder="Joueur">`:`<b>${esc(v)}</b><span>${esc(x.c)}</span>`}</div></div>`}).join("")}</div>`}
function r2(){
const{p,a,b}=G,last=G.ph==2;
$("app").innerHTML=`<div class="sub">Le duel · étape ${G.ph+1}/3 · ${PH[G.ph].t}</div><h1 style="font-size:clamp(40px,11vw,80px)">${esc(a)} <span>vs</span> ${esc(b)}</h1>
<div class="card t">Joueur de <b>${esc(a)}</b> ou <b>${esc(b)}</b> ayant joué dans le club tiré au sort. Le plus rapide prend le joueur qu'il veut : un joueur ne peut être pris qu'une fois. Les clubs des prochains postes restent cachés.</div>
${p.map((x,k)=>`<h2 class="win" style="font-size:24px;margin:14px 0 6px">${esc(x)}</h2>${pitch2(k)}`).join("")}
${PH[G.ph].s.some(i=>G.slots[i].ex===null)?'<div class="t">⚠ Faisabilité du tirage non vérifiée (vérification indisponible).</div>':""}<div class="err" id="e"></div><button onclick="nx2()">${last?"Vérifier les five":"Suivant → "+PH[G.ph+1].t}</button> ${back()}`}
async function nx2(){
const{p}=G,cur=PH[G.ph].s,tmp={},seen={};
Object.entries(G.nm).forEach(([k,v])=>seen[norm(v)]=k);
for(let k=0;k<p.length;k++)for(const i of cur){
const n=$(`n${k}_${i}`).value.trim();
if(!n)return $("e").textContent=`Complète le poste ${G.slots[i].s} pour ${p[k]}.`;
const key=norm(n);if(seen[key]!==undefined)return $("e").textContent=`❌ ${n} est déjà pris (${p[+seen[key].split("_")[0]]}).`;
seen[key]=k+"_"+i;tmp[k+"_"+i]=n}
Object.assign(G.nm,tmp);
if(G.ph<2){G.ph++;$("app").innerHTML=`<div class="sub">🎲 Tirage des clubs…</div>`;await draw2();r2()}else res2()}
async function res2(){
const{p,slots}=G,P=[];
for(let k=0;k<p.length;k++)for(let i=0;i<5;i++)P.push({id:k+"_"+i,k,i,n:G.nm[k+"_"+i],slot:slots[i].s,club:slots[i].c,g:0,ok:true,why:""});
if(!SM){P.forEach(x=>{x.why="À vérifier à la main"});G.rev=P;return rev2()}
$("app").innerHTML=`<div class="sub">🔎 Vérification des joueurs en cours…</div>`;
try{
const q=P.map(x=>({id:x.id,joueur:x.n,poste:x.slot,club:x.club}));
let r=await SM.json(`Tu es l'arbitre d'un quizz de foot. Duel : ${G.a} vs ${G.b}. ${G.ty=="n"?"Chaque joueur doit avoir la nationalité (ou avoir joué en sélection) de l'une de ces deux équipes.":"Chaque joueur doit avoir joué pour l'un de ces deux clubs."} Pour chaque pick vérifie : (1) le joueur existe, (2) il respecte la condition ci-dessus, (3) son poste principal correspond au poste demandé (Défenseur, Milieu ou Attaquant), (4) il a joué pour le club indiqué. goals = buts marqués avec CE club, toutes compétitions officielles confondues. Si une condition échoue : valid=false et goals=0. Réponds UNIQUEMENT par un tableau JSON [{"id":"...","player":"nom complet","valid":true,"goals":12,"reason":"courte phrase"}]. Picks : ${JSON.stringify(q)}`,{modelTier:"default"});
if(!Array.isArray(r))r=r.picks||r.results||[];
const dup={};
P.forEach(x=>{const y=r.find(z=>z.id==x.id)||{};x.n=y.player||x.n;x.ok=y.valid!==false&&y.goals!=null;x.g=x.ok?+y.goals:0;x.why=y.reason||"";
const key=norm(x.n);if(dup[key]){x.ok=false;x.g=0;x.why="Déjà pris (même joueur)"}dup[key]=1})
}catch(e){P.forEach(x=>{x.why="À vérifier à la main (vérification indisponible)"})}
G.rev=P;rev2()}
function rev2(){
const{p,slots}=G;

const T=p.map((x,k)=>{const L=G.rev.filter(y=>y.k==k);return{x,tot:L.reduce((a,y)=>a+y.g,0),list:L.map(y=>`${y.ok?"":"⚠ "}${y.n} (${y.g})`)}}).sort((a,b)=>b.tot-a.tot);

${T.map((r,j)=>`<div class="card"><div class="row ${j?'':'win'}"><b>${j+1}. ${esc(r.x)}${j?'':' 🏆'}</b><span>${r.tot} buts</span></div><div>${r.list.map(l=>`<span class="tag">${esc(l)}</span>`).join("")}</div></div>`).join("")}
<button onclick="s2()">Rejouer</button> ${back()}`}

/* JEU 3 : CHAINON */
function s3(){$("app").innerHTML=setup("Le Chaînon","Chacun cite un joueur qui a partagé un club avec le précédent. Le club annoncé est vérifié pour les deux joueurs.",'<label>Vies</label><input id="l" type="number" value="3" min="1">',"go3")}
function go3(){const p=names($("p").value);if(!okP(p))return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";if(!need())return;G={p,club:rnd(CLU),al:p.map(()=>+$("l").value||3),hist:[],used:[],i:0,msg:""};r3()}
function nxt3(){do{G.i=(G.i+1)%G.p.length}while(G.al[G.i]<=0)}
function r3(){
const{p,al,hist}=G;if(al.filter(x=>x>0).length<=1)return res3();
const f=!hist.length,last=hist[hist.length-1];
$("app").innerHTML=`<h2>Le Chaînon</h2><div class="card">${f?`<div class="t">Club tiré au sort</div><div class="big win" style="font-size:38px">${esc(G.club)}</div><div class="t">Cite un joueur qui a joué dans ce club.</div>`:`<div class="t">Joueur précédent</div><div class="big" style="font-size:38px">${esc(last.n)}</div>`}
<h2 class="win" style="font-size:28px;margin-top:10px">${esc(p[G.i])}</h2><label>Joueur cité</label><input id="pl">${f?"":'<label>Club en commun</label><input id="cl">'}
<div class="r"><button id="b" onclick="add3()">Valider</button><button class="s" onclick="lose3('sèche (-1 vie)')">Je sèche</button></div><div class="err" id="e">${esc(G.msg)}</div></div>
${board(p,k=>al[k]>0?"❤️".repeat(al[k]):"💀")}<div class="card t">${hist.map(h=>`<span class="tag">${esc(h.n)}${h.c?" · "+esc(h.c):""}</span>`).join("→")}</div>${back()}`}
function lose3(m){G.al[G.i]--;G.msg=G.p[G.i]+" : "+m;nxt3();r3()}
async function add3(){
if(!need())return;
const nm=$("pl").value.trim(),cl=$("cl")?$("cl").value.trim():"";
if(!nm||($("cl")&&!cl))return $("e").textContent="Remplis les champs.";
const f=!G.hist.length;$("b").disabled=true;$("e").textContent="🔎 Vérification…";
try{
const r=await SM.json(f?`Quizz foot. Tes connaissances peuvent être en retard sur les transferts récents : en cas de doute, mets valid=false. Le joueur cité est "${nm}". A-t-il réellement joué pour l'équipe première de ${G.club} ? JSON uniquement : {"valid":true,"player":"nom complet","reason":"courte phrase"}`:`Quizz foot « Chaînon ». Date du jour : ${new Date().toLocaleDateString("fr-FR")}. Tes connaissances peuvent être en retard sur les transferts récents : en cas de doute, mets valid=false. Joueur précédent : "${G.hist[G.hist.length-1].n}". Joueur cité : "${nm}". Club annoncé : "${cl}". Valide uniquement si les DEUX joueurs ont réellement joué pour l'équipe première de ce club. JSON uniquement : {"valid":true,"player":"nom complet du joueur cité","club":"nom correct du club","reason":"courte phrase"}`,{modelTier:"default"});
const n=r.player||nm,k=norm(n);
if(!r.valid){G.man={nm,cl};$("e").innerHTML=`❌ ${esc(r.reason||"Non validé par l'IA")} (peut-être trop récent). Le groupe tranche :<div class="r"><button class="s" onclick="man3()">Confirmer quand même</button>${f?'<button class="s" onclick="r3()">Réessayer</button>':'<button class="s" onclick="lose3(&quot;refusé (-1 vie)&quot;)">Refuser (-1 vie)</button>'}</div>`;return}
if(G.used.includes(k))return lose3("❌ "+n+" déjà cité (-1 vie)");
G.used.push(k);G.hist.push({n,c:r.club||cl||G.club});G.msg="✅ "+n+(r.reason?" · "+r.reason:"");nxt3();r3()
}catch(e){G.man={nm,cl};$("e").innerHTML='Vérification indisponible. <button class="s" onclick="man3()">Valider à la main</button>';$("b").disabled=false}}
function man3(){const{nm,cl}=G.man,k=norm(nm);if(G.used.includes(k))return lose3("❌ "+nm+" déjà cité (-1 vie)");G.used.push(k);G.hist.push({n:nm,c:cl||G.club});G.msg="✅ "+nm+" (validé par le groupe)";nxt3();r3()}
function res3(){const w=G.p[G.al.findIndex(x=>x>0)];
$("app").innerHTML=`<h1>Vain<span>queur</span></h1><div class="card"><h2 class="win">🏆 ${esc(w)}</h2><div class="t">Chaîne de ${G.hist.length} joueurs</div><div style="margin-top:10px">${G.hist.map(h=>`<span class="tag">${esc(h.n)}${h.c?" · "+esc(h.c):""}</span>`).join("→")}</div></div><button onclick="s3()">Rejouer</button> ${back()}`}

function s4(){$("app").innerHTML=setup("Le Top 10","Un top 10 caché. Cite des noms : rang 1 = 10 pts, rang 10 = 1 pt, hors top 10 = 0.",'<label>Thème (vide = tirage au sort)</label><input id="th" placeholder="Meilleurs buteurs de l\'histoire de la Ligue des champions"><label>Tours par joueur</label><input id="n" type="number" value="3" min="1">',"go4")}
async function go4(){
const p=names($("p").value),th=$("th").value.trim()||rnd(TH);
if(!okP(p))return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";if(!need())return;
$("e").textContent="🔎 Constitution du top 10…";
try{const r=await SM.json(`Tu prépares un quizz foot « Top 10 ». Thème : "${th||"un thème original de culture foot, au choix"}". Donne un top 10 fiable, sans ex aequo, du 1er au 10e. JSON uniquement : {"theme":"intitulé court","list":[{"name":"...","value":"chiffre ou précision"}]}`,{modelTier:"default"});

<div class="card">${L.map((x,k)=>`<div class="row ${x.f!==null?'win':''}"><span>${k+1}. ${x.f!==null?`<b>${esc(x.name)}</b> <span class="t">${esc(x.value||"")}</span>`:"???"}</span><span>${x.f!==null?"+"+(10-k)+" · "+esc(p[x.f]):""}</span></div>`).join("")}</div>
<div class="card"><div class="t">Tour ${G.turn+1}/${p.length*n}</div><h2 class="win" style="font-size:28px">${esc(p[i])}</h2><input id="pl" placeholder="Nom cité"><button id="b" onclick="add4(${i})">Valider</button><div class="err" id="e">${esc(G.msg)}</div></div>
${board(p,k=>G.sc[k]+" pts")}${back()}`}
async function add4(i){
const nm=$("pl").value.trim();if(!nm||!need())return;
$("b").disabled=true;$("e").textContent="🔎 Vérification…";
try{const r=await SM.json(`Quizz foot. Thème : "${G.th}". Top 10 : ${JSON.stringify(G.L.map((x,k)=>k+1+". "+x.name))}. Le nom cité est « ${nm} ». Fait-il partie de ce top 10 (même nom abrégé ou surnom) ? JSON uniquement : {"rank":numéro de 1 à 10 ou null}`,{modelTier:"default"});
const k=r.rank?r.rank-1:-1;
if(k<0||!G.L[k])G.msg="❌ "+nm+" n'est pas dans le top 10 (0 pt)";
else if(G.L[k].f!==null)G.msg="⚠ "+G.L[k].name+" déjà trouvé (0 pt)";
else{G.L[k].f=i;G.sc[i]+=10-k;G.msg="✅ "+G.L[k].name+" : rang "+(k+1)+" (+"+(10-k)+")"}
G.turn++;r4()}catch(e){const q=norm(nm);sc4(i,q.length<3?-1:G.L.findIndex(x=>norm(x.name).includes(q)),nm)}}
function sc4(i,k,nm){if(k<0||!G.L[k])G.msg="❌ "+nm+" n'est pas dans le top 10 (0 pt)";else if(G.L[k].f!==null)G.msg="⚠ "+G.L[k].name+" déjà trouvé (0 pt)";else{G.L[k].f=i;G.sc[i]+=10-k;G.msg="✅ "+G.L[k].name+" : rang "+(k+1)+" (+"+(10-k)+")"}G.turn++;r4()}
function res4(){
const{p,L}=G,R=p.map((x,k)=>({x,s:G.sc[k]})).sort((a,b)=>b.s-a.s);
$("app").innerHTML=`<h1>Résul<span>tats</span></h1><div class="sub">${esc(G.th)}</div>
${R.map((r,j)=>`<div class="card"><div class="row ${j?'':'win'}"><b>${j+1}. ${esc(r.x)}${j?'':' 🏆'}</b><span>${r.s} pts</span></div></div>`).join("")}
<div class="card"><h2 style="font-size:24px">Le vrai top 10</h2>${L.map((x,k)=>`<div class="row"><span>${k+1}. ${esc(x.name)} <span class="t">${esc(x.value||"")}</span></span><span class="t">${x.f!==null?esc(p[x.f]):"non trouvé"}</span></div>`).join("")}</div>
<button onclick="s4()">Rejouer</button> ${back()}`}
/* JEU 5 : L'ORDRE */
function s5(){$("app").innerHTML=setup("L'Ordre","Classe 5 éléments dans le bon ordre. Par élément : 4 pts si exact, 3 pts à 1 rang près, etc. Les manches s'additionnent.",'<label>Thème (vide = tirage au sort à chaque manche)</label><input id="th" placeholder="Ballons d\'Or, stades, transferts…">',"go5")}
function go5(){const p=names($("p").value);if(!okP(p))return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";if(!need())return;G={p,th:$("th").value.trim(),tot:p.map(()=>0),seen:[]};nx5()}
async function nx5(){
$("app").innerHTML=`<div class="sub">🔎 Préparation du défi…</div>`;
const pool=OT.filter(x=>!(G.tt||[]).includes(x)),th=G.th||rnd(pool.length?pool:OT);(G.tt=G.tt||[]).push(th);
try{const r=await SM.json(`Crée un défi de classement pour un quizz de foot. Thème : "${th}". ${G.seen.length?"Critères déjà joués, à éviter : "+G.seen.join("; ")+".":""} Donne 5 éléments (joueurs, clubs, stades ou sélections) à classer selon UN critère chiffré précis, avec des valeurs toutes différentes et fiables. JSON uniquement : {"critere":"ex : Nombre de buts en Ligue des champions","sens":"décroissant ou croissant","items":[{"name":"...","value":nombre}]}`,{modelTier:"default"});
const dec=/^d/i.test((r.sens||"d").trim()),it=r.items.slice(0,5).map(x=>({name:x.name,value:+x.value}));
it.sort((a,b)=>dec?b.value-a.value:a.value-b.value);it.forEach((x,k)=>x.rank=k+1);
G.seen.push(r.critere);G.r={c:r.critere,th,dec,items:sh(it)};r5()}catch(e){$("app").innerHTML=`<div class="card"><div class="err">Impossible de créer le défi.</div><button onclick="nx5()">Réessayer</button> ${back()}</div>`}}
function r5(){const{p,r}=G;
$("app").innerHTML=`<h2>L'Ordre</h2><div class="sub">Thème tiré au sort : ${esc(r.th)}</div><div class="card"><b>${esc(r.c)}</b></div><div class="card t">Classe de 1 à 5, du ${r.dec?"plus grand au plus petit":"plus petit au plus grand"}. Chaque joueur remplit sa colonne.</div>
<div class="card tb"><table><tr><th>Élément</th>${p.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${r.items.map((it,j)=>`<tr><td><b>${esc(it.name)}</b></td>${p.map((x,k)=>`<td><select id="o${k}_${j}"><option value="">—</option>${[1,2,3,4,5].map(v=>`<option>${v}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}</table></div>
<div class="err" id="e"></div><button onclick="fin5()">Valider</button> ${back()}`}
function fin5(){const{p,r}=G,rp=[];
for(let k=0;k<p.length;k++){const g=r.items.map((_,j)=>+$(`o${k}_${j}`).value);
if(g.some(v=>!v)||new Set(g).size<5)return $("e").textContent=`${p[k]} : utilise chaque rang de 1 à 5 une seule fois.`;
rp.push(r.items.reduce((a,it,j)=>a+Math.max(0,4-Math.abs(g[j]-it.rank)),0))}
rp.forEach((v,k)=>G.tot[k]+=v);
const R=p.map((x,k)=>({x,m:rp[k],t:G.tot[k]})).sort((a,b)=>b.t-a.t);
$("app").innerHTML=`<h1>Résul<span>tats</span></h1><div class="sub">${esc(r.c)}</div>
<div class="card">${[...r.items].sort((a,b)=>a.rank-b.rank).map(it=>`<div class="row"><span>${it.rank}. <b>${esc(it.name)}</b></span><span class="win">${it.value}</span></div>`).join("")}</div>
${R.map((x,j)=>`<div class="card"><div class="row ${j?'':'win'}"><b>${j+1}. ${esc(x.x)}${j?'':' 🏆'}</b><span>+${x.m} · total ${x.t} pts</span></div></div>`).join("")}
<button onclick="nx5()">Manche suivante</button> ${back()}`}

function go6(){const p=names($("p").value),t=+$("t").value||Math.round((400+Math.random()*700)/50)*50;if(!okP(p))return $("e").textContent="Il faut au moins 2 joueurs aux noms différents.";if(!need())return;G={p,t,n:+$("n").value||4,picks:p.map(()=>[]),used:[],turn:0,pend:null,msg:""};r6()}
function r6(){
const{p,t,n,picks}=G,tot=p.length*n;if(G.turn>=tot)return res6();
const i=G.turn%p.length,q=G.pend;
$("app").innerHTML=`<h2>Le DS</h2><div class="sub">Cible : ${t} M€</div><div class="card"><div class="t">Tour ${G.turn+1}/${tot}</div><h2 class="win" style="font-size:28px">${esc(p[i])}</h2>

<div class="err" id="e">${esc(G.msg)}</div></div>
${board(p,k=>picks[k].map(x=>`<span class="tag">${esc(x.n)} ${x.v} M€</span>`).join("")+" = "+picks[k].reduce((a,x)=>a+x.v,0)+" M€")}${back()}`}
async function add6(i){
const nm=$("pl").value.trim(),tr=$("tr").value.trim();
if(!nm||!tr)return $("e").textContent="Remplis le joueur et le transfert.";
if(G.used.includes(norm(nm)))return $("e").textContent="❌ Déjà cité !";
if(!need())return;$("b").disabled=true;$("e").textContent="🔎 Vérification du transfert…";
try{const r=await SM.json(`Quizz foot « Le DS ». Date du jour : ${new Date().toLocaleDateString("fr-FR")}. Tes connaissances peuvent être en retard sur le mercato récent : si tu ne connais pas ce transfert, mets valid=false (ne dis jamais qu'il n'a pas eu lieu) et explique dans note. Joueur : "${nm}". Transfert annoncé : "${tr}". Vérifie que ce joueur a bien été transféré entre ces deux clubs, puis donne le montant officiel de l'indemnité de transfert en millions d'euros (nombre ; prêt ou libre = 0). S'il y a eu plusieurs transferts entre ces clubs, prends le plus connu. JSON uniquement : {"valid":true,"player":"nom complet","from":"club de départ","to":"club d'arrivée","year":"année","fee":nombre ou null,"note":"courte précision"}`,{modelTier:"default"});
if(r.valid!==true){G.pend={i,n:r.player||nm,tr,v:r.fee??null,unv:1,note:"· ⚠ Transfert non reconnu"+(r.note?" ("+r.note+")":"")+". Il est peut-être trop récent : vérifie sur Transfermarkt, puis confirme avec le bon montant."};G.msg="";return r6()}
if(G.used.includes(norm(r.player||nm))){G.msg="❌ "+(r.player||nm)+" déjà cité !";return r6()}
G.pend={i,n:r.player||nm,tr:`${r.from} → ${r.to}${r.year?" ("+r.year+")":""}`,v:r.fee,note:"· "+(r.note||"")+" · estimation IA, corrige si besoin"};G.msg="";r6()
}catch(e){G.pend={i,n:nm,tr,v:null,unv:1,note:"· vérification indisponible : saisis le montant (Transfermarkt)"};G.msg="";r6()}}
function ok6(){const q=G.pend,v=$("pv").value;
if(v===""||+v<0)return $("e").textContent="Indique un montant.";

G.used.push(norm(q.n));G.picks[q.i].push({n:q.n,tr:q.tr,v:+v});G.pend=null;G.msg="";G.turn++;r6()}
function res6(){
const{p,t,picks}=G,R=p.map((x,k)=>{const s=picks[k].reduce((a,q)=>a+q.v,0);return{x,s,d:Math.abs(t-s),k}}).sort((a,b)=>a.d-b.d);
$("app").innerHTML=`<h1>Résul<span>tats</span></h1><div class="sub">Cible : ${t} M€</div>
${R.map((r,j)=>`<div class="card"><div class="row ${j?'':'win'}"><b>${j+1}. ${esc(r.x)}${j?'':' 🏆'}</b><span>${r.s} M€ (écart ${r.d})</span></div>${picks[r.k].map(q=>`<div class="t">${esc(q.n)} · ${esc(q.tr)} · ${q.v} M€</div>`).join("")}</div>`).join("")}
<button onclick="s6()">Rejouer</button> ${back()}`}

async function gen7(name){
$("app").innerHTML=`<div class="sub">🔎 Préparation de la question…</div>`;
for(let t=0;t<2;t++)try{
const r=await SM.json(`Quizz foot « Le Parcours ». Date du jour : ${new Date().toLocaleDateString("fr-FR")}. ${name?`Le joueur est "${name}".`:`Choisis au hasard un footballeur professionnel connu (varie époques, pays et postes ; évite : ${G.seen.join(", ")||"aucun"}).`} Donne : "bon" = un club où il a réellement joué en équipe première ; "faux" = 4 clubs plausibles (niveau et pays comparables) où il n'a JAMAIS joué, même en prêt ; "carriere" = tous ses clubs. JSON uniquement : {"joueur":"nom complet","bon":"club","faux":["a","b","c","d"],"carriere":["..."]}`,{modelTier:"default"});
const car=(r.carriere||[]).map(norm),faux=[...new Set(r.faux||[])].filter(x=>!car.includes(norm(x))&&norm(x)!=norm(r.bon));

${q.pick!==null?`<div class="card"><b class="win">${q.pick==q.bon?"✅ Bonne réponse !":"❌ Raté, c'était "+esc(q.bon)}</b><div class="t" style="margin-top:6px">${esc(q.j)} : ${q.car.map(esc).join(" → ")}</div><button onclick="G.turn++;nx7()">Suivant</button></div>`:""}${back()}`}
